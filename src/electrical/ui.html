<title>LAZY Electrical</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: plain black-on-white drafting sheet — form column left, drawing set right. One deliberate light theme. */
:root{
  --bg:#ffffff; --panel:#ffffff; --field:#ffffff; --ink:#000000; --muted:#555555; --soft:#d9d9d9;
  --f-ui:"IBM Plex Sans",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;gap:14px;height:100%;min-height:600px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:10px}
header h1{margin:0;font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.02em}
header h1 b{background:var(--ink);color:var(--bg);padding:0 6px;margin-right:6px;font-weight:600}
header .sub{font-size:12px;color:var(--muted)}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink);background:var(--bg);border-radius:0;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg);font-weight:600}
.btn.primary:hover{background:var(--bg);color:var(--ink)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:focus-visible,.x:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.main{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;min-height:0}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)} .app{height:auto} .form,.preview{overflow:visible}}
.form{overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0;padding-bottom:20px}
.card{background:var(--panel);border:1px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:-12px -12px 0;padding:6px 12px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:8px;min-height:36px}
.card > h2{cursor:pointer;user-select:none}
.card > h2::before{content:"▾";font-family:var(--f-ui);font-size:12px;width:10px}
.card.fold > h2::before{content:"▸"}
.card.fold{padding-bottom:0;gap:0}
.card.fold > h2{border-bottom:0}
.card.fold > :not(h2){display:none!important}
.card h2 .btn{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--f-ui)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
input[type=text],select,textarea{border:1px solid var(--ink);background:var(--field);border-radius:0;padding:6px 8px;width:100%;min-width:0}
input[type=checkbox]{accent-color:#000;width:16px;height:16px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px;align-items:center}
.row.in,.row.out{grid-template-columns:52px minmax(0,1fr) minmax(0,1.1fr) 28px}
.row.mot{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px 52px 28px}
.row .hd{font-size:11px;color:var(--muted)}
.x{border:1px solid var(--ink);background:var(--bg);border-radius:0;width:28px;height:30px;cursor:pointer}
.x:hover{background:var(--ink);color:var(--bg)}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.formInner{display:flex;flex-direction:column;gap:12px}
#aiCard textarea{min-height:84px;resize:vertical;font-family:var(--f-ui)}
.aiRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aiStatus{font-size:13px;line-height:1.45;white-space:pre-wrap}
.aiStatus.err{font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--bg);color:var(--ink)}
.btn.primary:disabled:hover{background:var(--ink);color:var(--bg)}
.warn{border:2px solid var(--ink);padding:8px 10px;font-size:13px;line-height:1.45}
.warn strong{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.warn ul{margin:4px 0 0;padding-left:18px}
.preview{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;background:var(--bg);padding-bottom:6px;z-index:2}
.tab{font-family:var(--f-mono);font-size:12px;border:1px solid var(--ink);background:var(--bg);border-radius:0;padding:3px 8px;cursor:pointer}
.tab:hover{background:var(--ink);color:var(--bg)}
.sheet{background:#fff;border:1px solid var(--soft);overflow-x:auto}
.sheet svg{display:block;width:100%;min-width:640px;height:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;font-size:13px;max-width:min(520px,90vw);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* drawing editor */
.modebar{display:flex;gap:10px;align-items:center}
.viewPane{display:flex;flex-direction:column;gap:12px}
.main.noside{grid-template-columns:minmax(0,1fr)}
.main.noside>.form{display:none}
.viewPane[hidden]{display:none}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:var(--bg);padding:6px 14px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.edBanner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.edBanner[hidden]{display:none}
#editor{display:flex;flex-direction:column;gap:8px;min-height:0}
#editor[hidden]{display:none}
.edTools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.edTools button{border:1px solid var(--ink);background:var(--bg);padding:5px 10px;cursor:pointer;min-width:34px}
.edTools button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.edTools button:hover{background:var(--ink);color:var(--bg)}
.edTools .sp,.edProps .sp{width:8px}
.edProps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--ink);padding:6px}
.edProps[hidden]{display:none}
.edProps .pt{font-family:var(--f-mono);font-size:13px;width:auto;min-width:4ch;padding:4px 6px}
.edProps .sp{flex:1}
.tab.on,.tab[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.edBody{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;height:calc(100vh - 250px);min-height:420px}
.edPal{overflow:auto;border:1px solid var(--soft);padding:6px;display:flex;flex-direction:column;gap:4px}
.edPal [hidden]{display:none!important}
#palSearch{width:100%;padding:4px 6px;font-size:12px}
.lazyico{display:block;width:26px;height:26px;flex:none}
.palh{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.edPal button{display:flex;align-items:center;gap:6px;border:1px solid var(--soft);background:var(--bg);padding:3px 4px;cursor:grab;text-align:left;font-size:11px;line-height:1.2}
.edPal button:hover{border-color:var(--ink)}
.edPal button[aria-pressed=true]{border:2px solid var(--ink);background:#f0f0f0}
.edPal svg{width:26px;height:26px;flex:none}
.edPal svg *{stroke-width:.35;vector-effect:non-scaling-stroke}
.edWrap{position:relative;overflow:auto;border:1px solid var(--soft);background:#f4f4f4}
#edSvg{display:block;width:100%;height:auto;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#edSvg[data-tool=wire],#edSvg[data-tool=part]{cursor:crosshair}
#edSvg[data-tool=text]{cursor:text}
#edSvg[data-tool=pan]{cursor:grab}
#edSvg text{stroke:none}
#edSvg .hit{fill:#000;fill-opacity:0;stroke:none}
#edSvg .hitw{stroke:#000;stroke-opacity:0;stroke-width:2.2}
#edSvg[data-tool=sel] .o:not(.lock){cursor:move}
#edSvg[data-tool=sel] .o:not(.lock):hover .hit{fill-opacity:.05}
#edSvg .o.sel .hit{fill-opacity:.08;stroke:#000;stroke-width:.25;stroke-dasharray:1 .6}
#edSvg .o.sel.w line{stroke-width:.7}
#edSvg .o.sel.w .hitw{stroke-opacity:.12}
#edSvg .lock{pointer-events:none}
#edSvg .lock text{pointer-events:auto;cursor:text}
#edSvg .hd{fill:#fff;stroke:#000;stroke-width:.3;cursor:move}
#edSvg[data-tool=wire] .o,#edSvg[data-tool=part] .o,#edSvg[data-tool=text] .o{pointer-events:none}
.edInline{position:absolute;z-index:5;font-family:var(--f-mono);font-size:13px;border:2px solid var(--ink);background:#fff;padding:3px 6px;min-width:90px;width:auto}
@media (max-width:900px){
  .edBody{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:auto}
  .edPal{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:flex-start}
  .palh{writing-mode:vertical-rl;transform:rotate(180deg);margin:0}
  .edPal button{flex-direction:column;flex:none;width:76px;height:74px;text-align:center;overflow:hidden}
  .edWrap{height:65vh}
}
</style>

<div class="app">
  <header>
    <h1><b>LAZY</b>Electrical</h1>
    <span class="sub">LOGO!-schakelkasten → volledige schemaset</span>
    <div class="actions">
      <button class="btn" id="exBtn" type="button">Voorbeeld laden</button>
      <button class="btn" id="saveBtn" type="button">Project kopiëren</button>
      <button class="btn" id="openBtn" type="button">Project plakken</button>
      <button class="btn primary" id="pdfBtn" type="button">PDF downloaden</button>
    </div>
  </header>
  <div class="main">
    <div class="form">
      <section class="card" id="aiCard">
        <h2>AI-assistent</h2>
        <div id="aiBody"><p class="hint">AI wordt geladen…</p></div>
      </section>
      <section class="card" id="teachCard">
        <h2>Regels voor de AI</h2>
        <div id="teachBody"></div>
      </section>
      <div class="formInner" id="form"></div>
    </div>
    <div class="preview">
      <div class="modebar"><div class="seg" id="modeSeg" role="group" aria-label="Weergave"><button type="button" data-mode="view" aria-pressed="true">Bekijken</button><button type="button" data-mode="draw" aria-pressed="false">Tekenen</button></div><button class="btn small" type="button" id="sideBtn" style="margin-left:auto">Formulier verbergen</button></div>
      <div class="warn edBanner" id="edBanner" hidden></div>
      <div id="viewPane" class="viewPane">
        <div id="warnings"></div>
        <div class="tabs" id="tabs"></div>
        <div id="sheets" style="display:flex;flex-direction:column;gap:14px"></div>
      </div>
      <div id="editor" hidden>
        <div class="edTools" id="edTools">
          <button type="button" data-tool="sel" aria-pressed="true" title="Selecteren en verslepen (V)">Selecteren</button>
          <button type="button" data-tool="wire" aria-pressed="false" title="Draad tekenen (W)">Draad</button>
          <button type="button" data-tool="text" aria-pressed="false" title="Tekst plaatsen (T)">Tekst</button>
          <button type="button" data-tool="pan" aria-pressed="false" title="Blad verschuiven (H)">Verschuiven</button>
          <span class="sp"></span>
          <button type="button" data-act="undo" title="Ongedaan maken (Ctrl+Z)">↶</button>
          <button type="button" data-act="redo" title="Opnieuw (Ctrl+Y)">↷</button>
          <span class="sp"></span>
          <button type="button" data-act="grid" id="edGridBtn" aria-pressed="true" title="Raster tonen en vastklikken (Alt = vrij plaatsen)">Raster</button>
          <button type="button" data-act="align" title="Alles op dit blad op het raster zetten">Uitlijnen</button>
          <span class="sp"></span>
          <button type="button" data-act="zout" title="Uitzoomen">−</button>
          <button type="button" data-act="zfit" id="edZoomTxt" title="Passend maken">100%</button>
          <button type="button" data-act="zin" title="Inzoomen">+</button>
        </div>
        <div class="tabs" id="edTabs"></div>
        <div class="edProps" id="edProps" hidden></div>
        <div class="edBody">
          <div class="edPal" id="edPal"></div>
          <div class="edWrap" id="edWrap"><svg id="edSvg" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tekenblad"></svg></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/*__ENGINE__*/
</script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var KEY='lazyelectrical.project';
var store={get:function(){try{return localStorage.getItem(KEY)||localStorage.getItem('schemaforge.project')}catch(e){return null}},set:function(v){try{localStorage.setItem(KEY,v)}catch(e){}}};
var P;
try{P=JSON.parse(store.get())||SF.example()}catch(e){P=SF.example()}
if(!P||!Array.isArray(P.motors))P=SF.example();

var KIND={NO:'Drukknop NO (13-14)',NC:'Drukknop NC (21-22)',ESTOP:'Noodstop (NC)',THERMAL:'Thermisch relais van motor'};
var TYPE={DOL:'Direct',REV:'Omkeer (links/rechts)',YD:'Ster-driehoek'};
var ROLE_EN={run:'contactor',right:'rechts',left:'links',main:'net',star:'ster',delta:'driehoek'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function opt(v,l,sel){return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'}
function field(id,lab,val){return '<div class="f"><label for="'+id+'">'+lab+'</label><input type="text" id="'+id+'" data-k="'+id.slice(2)+'" value="'+esc(val)+'"></div>'}
function nums(max,sel,prefix){var h='';for(var i=1;i<=max;i++)h+=opt(i,prefix+i,sel);return h}
function loadOptions(sel){
  var h=opt('LAMP','Signaallamp',sel)+opt('BUZZER','Zoemer',sel);
  P.motors.forEach(function(m,i){(SF.ROLES[m.type]||SF.ROLES.DOL).forEach(function(r){h+=opt('M:'+i+':'+r,(m.name||'Motor '+(i+1))+' – '+ROLE_EN[r],sel)})});
  return h;
}
var ROLE_LBL={run:'Startknoppen (parallel)',right:'Startknoppen rechts (parallel)',left:'Startknoppen links (parallel)'};
function ensureHw(){
  if(!P.motors[0])return null;
  var H=SF.hwOf(P);P.hw=P.hw||{};
  if(!Array.isArray(P.hw.stops)||!P.hw.stops.length)P.hw.stops=H.stops.slice();
  if(!P.hw.starts||typeof P.hw.starts!=='object')P.hw.starts={};
  H.roles.forEach(function(r){if(!Array.isArray(P.hw.starts[r])||!P.hw.starts[r].length)P.hw.starts[r]=H.starts[r].slice()});
  if(P.hw.lamps==null)P.hw.lamps=true;
  return H;
}
function hwRows(path,list,max,addLbl){
  var h='<div class="rows">';
  list.forEach(function(t,i){h+='<div class="row" style="grid-template-columns:minmax(0,1fr) 28px"><input type="text" aria-label="Naam drukknop" data-hw="'+path+'" data-i="'+i+'" value="'+esc(t)+'">'+(list.length>1?'<button class="x" type="button" data-hwdel="'+path+'" data-i="'+i+'" aria-label="Drukknop verwijderen">×</button>':'<span></span>')+'</div>'});
  h+='</div>';
  if(list.length<max)h+='<button class="btn small" type="button" data-hwadd="'+path+'" style="align-self:flex-start">'+addLbl+'</button>';
  return h;
}
function ladderCard(){
  var n=P.ladder.rungs.length;
  var h='<section class="card"><h2>Stuurkring</h2><p class="hint">Getekend vanuit laddercode: '+n+' sport'+(n===1?'':'en')+'. De AI-assistent schrijft en wijzigt die; je kunt ze ook zelf bewerken.</p>';
  h+='<div class="aiRow"><button class="btn small" type="button" id="ladEdit">Laddercode bewerken</button><button class="btn small" type="button" id="ladReset">Terug naar eenvoudige knoppen</button></div>';
  h+='<div id="ladBox" hidden><textarea id="ladText" rows="12" spellcheck="false" aria-label="Laddercode" style="font-family:var(--f-mono);font-size:11px"></textarea><div class="aiRow" style="margin-top:6px"><button class="btn primary small" type="button" id="ladApply">Toepassen</button></div></div></section>';
  return h;
}
function hwCard(){
  if(P.ladder&&Array.isArray(P.ladder.rungs)&&P.ladder.rungs.length)return ladderCard();
  var h='<section class="card"><h2>Stuurkring</h2>';
  var H=P.motors[0]&&P.motors[0].type!=='YD'?ensureHw():null;
  if(!H){return h+'<p class="hint">Voeg een motor toe (direct of omkeer) om de contactorschakeling te tekenen.</p></section>'}
  h+='<div class="f"><label>Stopknoppen (in serie)</label>'+hwRows('stops',P.hw.stops,3,'Stopknop toevoegen')+'</div>';
  var mx=H.roles.length>1?2:3;
  H.roles.forEach(function(r){h+='<div class="f"><label>'+ROLE_LBL[r]+'</label>'+hwRows('starts:'+r,P.hw.starts[r],mx,'Startknop toevoegen')+'</div>'});
  h+='<label class="check"><input type="checkbox" id="hwLamps"'+(P.hw.lamps!==false?' checked':'')+'> Signaallampen (draairichting en storing)</label>';
  h+='<p class="hint">Stopknoppen staan in serie, startknoppen parallel met het houdcontact. Bij omkeer zijn de richtingen vergrendeld met de drukknoppen én de contactoren. Voor timers, eindeloopschakelaars of meerdere motoren: vraag het aan de AI-assistent of zet dit om naar laddercode.</p><button class="btn small" type="button" id="ladConvert" style="align-self:flex-start">Omzetten naar laddercode</button></section>';
  return h;
}
function hwList(path){var p=path.split(':');return p[0]==='stops'?P.hw.stops:P.hw.starts[p[1]]}
function renderForm(){
  var h='';
  h+='<section class="card"><h2>Project</h2><div class="grid2">'+field('p_name','Projectnaam',P.name)+field('p_tek','Getekend door (Tek.)',P.tek)+field('p_date','Datum',P.date)+field('p_nr','Tekeningnr.',P.nr)+field('p_functie','Functie',P.functie)+field('p_locatie','Locatie',P.locatie)+'</div>'+field('p_school','School of bedrijf (titelhoek)',P.school)+'</section>';
  var plcOpts='';Object.keys(SF.PLC).forEach(function(k){plcOpts+=opt(k,SF.PLC[k].label,P.plc)});
  h+='<section class="card"><h2>Sturing</h2><div class="grid2"><div class="f"><label for="plc">LOGO!-model</label><select id="plc">'+plcOpts+'</select></div>'+(P.plc==='none'?'':field('p_order','Bestelnummer',P.order))+'</div>'+(P.plc==='none'?'':'<p class="hint">Controleer het bestelnummer dat op je module staat.</p>')+'</section>';
  h+='<section class="card"><h2>Voeding</h2><div class="grid2">'+field('p_mainBreaker','Hoofdautomaat (4P)',P.mainBreaker)+field('p_b24','Automaat stuur 24 V',P.b24)+field('p_b230','Automaat stuur 230 V',P.b230)+'</div><label class="check"><input type="checkbox" id="estop"'+(P.estop?' checked':'')+'> '+(P.plc==='none'?'Noodstop in de stuurkring':'Noodstopcircuit (WAGO-relais + veiligheidscontactor)')+'</label></section>';
  h+='<section class="card"><h2>Motoren <button class="btn small" type="button" id="addMotor">Motor toevoegen</button></h2><div class="rows">';
  if(P.motors.length)h+='<div class="row mot"><span class="hd">Naam</span><span class="hd">Type</span><span class="hd">Automaat</span><span class="hd">Thermisch</span><span></span></div>';
  P.motors.forEach(function(m,i){
    var t='';Object.keys(TYPE).forEach(function(k){t+=opt(k,TYPE[k],m.type)});
    h+='<div class="row mot"><input type="text" aria-label="Naam motor" data-arr="motors" data-i="'+i+'" data-f="name" value="'+esc(m.name)+'"><select aria-label="Type motor" data-arr="motors" data-i="'+i+'" data-f="type">'+t+'</select><input type="text" aria-label="Automaat" data-arr="motors" data-i="'+i+'" data-f="breaker" value="'+esc(m.breaker)+'"><input type="checkbox" aria-label="Thermisch relais" data-arr="motors" data-i="'+i+'" data-f="thermal"'+(m.thermal!==false?' checked':'')+'><button class="x" type="button" data-del="motors" data-i="'+i+'" aria-label="Motor verwijderen">×</button></div>';
  });
  if(!P.motors.length)h+='<p class="hint">Nog geen motoren. Voeg er een toe om de vermogenkring te tekenen.</p>';
  h+='</div><p class="hint">Een omkeermotor heeft twee uitgangen nodig (rechts, links), ster-driehoek drie (net, ster, driehoek).</p></section>';
  if(P.plc==='none'){h+=hwCard();$('#form').innerHTML=h;applyFolds();return}
  h+='<section class="card"><h2>Ingangen <button class="btn small" type="button" id="addIn">Ingang toevoegen</button></h2><div class="rows">';
  P.inputs.forEach(function(it,i){

    else if(p.t==='pl')o.push('<'+(p.close?'polygon':'polyline')+' points="'+p.pts.map(function(q){return q[0].toFixed(2)+','+q[1].toFixed(2)}).join(' ')+'" fill="none" stroke-width="'+p.w+'"/>');

    else if(p.t==='c')o.push('<circle cx="'+p.x.toFixed(2)+'" cy="'+p.y.toFixed(2)+'" r="'+p.r+'" fill="'+(p.fill==='k'?'#000':p.fill==='w'?'#fff':'none')+'" stroke-width="'+p.lw+'"/>');
    else if(p.t==='tx')o.push('<text x="'+p.x.toFixed(2)+'" y="'+p.y.toFixed(2)+'" font-size="'+p.size+'"'+(p.bold?' font-weight="700"':'')+(p.rot?' transform="rotate(-'+p.rot+' '+p.x.toFixed(2)+' '+p.y.toFixed(2)+')"':'')+'>'+esc(p.s)+'</text>');

function teachText(){
  var t='',rules=TEACH.rules.join('\n'),ex=[];
  if(rules)t+='\n\nEXTRA ONTWERPREGELS VAN DE GEBRUIKER (altijd volgen, ze gaan voor op de standaardregels):\n'+rules;
  if(Array.isArray(ex)&&ex.length){
    t+='\n\nGOEDGEKEURDE VOORBEELDEN VAN DE GEBRUIKER (volg dezelfde aanpak en stijl bij gelijkaardige vragen):';
    ex.forEach(function(e,i){t+='\n'+(i+1)+'. Vraag: "'+e.q+'"\n   Goedgekeurd antwoord: '+JSON.stringify(e.p)});
  }
  return t;
}
var AI_ERR={not_granted:'Je hebt de pagina geen toestemming gegeven om Claude te gebruiken.',sampling_disabled:'Claude is niet beschikbaar voor dit account.',rate_limited:'Te veel aanvragen, of je gebruikslimiet is bereikt. Probeer het later opnieuw.',session_expired:'Je bent afgemeld. Meld je opnieuw aan bij Claude.',refused:'Claude weigerde deze vraag. Formuleer ze anders.',invalid_json:'Claude gaf drie keer een antwoord dat het programma niet kon lezen. Druk nog eens op Genereer; meestal lukt het dan wel.',empty_completion:'Er kwam geen antwoord. Probeer het korter of anders te formuleren.',prompt_too_large:'De vraag is te lang.'};
function normalizeProject(o){
  if(o&&typeof o==='object'&&o.project&&typeof o.project==='object'&&!o.motors)o=Object.assign({},o.project,{_uitleg:o._uitleg||o.project._uitleg});
  if(!o||typeof o!=='object'||Array.isArray(o))throw {code:'invalid_json'};
  if(!Array.isArray(o.motors))o.motors=JSON.parse(JSON.stringify(P.motors||[]));
  if(!Array.isArray(o.inputs))o.inputs=o.plc==='none'?[]:JSON.parse(JSON.stringify(P.inputs||[]));
  if(!Array.isArray(o.outputs))o.outputs=o.plc==='none'?[]:JSON.parse(JSON.stringify(P.outputs||[]));
  if(o.plc==null)o.plc=P.plc;
  if(o.estop==null)o.estop=P.estop;
  var uitleg=String(o._uitleg||'');delete o._uitleg;
  ['name','tek','date','nr','functie','locatie','school'].forEach(function(k){if(P[k])o[k]=P[k];else if(o[k]==null)o[k]=''});
  if(o.hw&&typeof o.hw==='object'){
    var hs=function(a){return (Array.isArray(a)?a:[]).map(function(x){return String(x||'').trim()}).filter(Boolean)};
    var st={};Object.keys(o.hw.starts||{}).forEach(function(r){if(['run','right','left'].indexOf(r)>=0)st[r]=hs(o.hw.starts[r])});
    o.hw={stops:hs(o.hw.stops),starts:st,lamps:o.hw.lamps!==false};
  } else delete o.hw;
  if(o.plc==='none'&&o.ladder&&typeof o.ladder==='object'&&Array.isArray(o.ladder.rungs)&&o.ladder.rungs.length)o.ladder={rungs:o.ladder.rungs};
  else delete o.ladder;
  if(!SF.PLC[o.plc])o.plc='0BA5';
  if(o.order==null)o.order=SF.PLC[o.plc].order;
  o.estop=!!o.estop;['mainBreaker','b24','b230'].forEach(function(k){if(!o[k])o[k]=P[k]||''});
  o.motors=o.motors.slice(0,3).map(function(m){return {name:String(m.name||'MOTOR'),type:SF.ROLES[m.type]?m.type:'DOL',breaker:String(m.breaker||'C16A'),thermal:m.thermal!==false}});
  o.inputs=o.inputs.map(function(i){var r={n:Math.max(1,Math.min(8,+i.n||1)),fn:String(i.fn||''),kind:KIND[i.kind]?i.kind:'NO'};if(r.kind==='THERMAL')r.m=Math.max(0,+i.m||0);return r});
  o.outputs=o.outputs.map(function(x){return {n:Math.max(1,Math.min(4,+x.n||1)),fn:String(x.fn||''),load:String(x.load||'LAMP')}});
  return {project:o,uitleg:uitleg};
}
function repairJson(t){
  var out='',inStr=false,esc2=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(inStr){out+=c;if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')inStr=false;continue}
    if(c==='"'){inStr=true;out+=c;continue}
    if(c==='/'&&t[i+1]==='/'){while(i<t.length&&t[i]!=='\n')i++;continue}
    if(c==='/'&&t[i+1]==='*'){i+=2;while(i<t.length&&!(t[i]==='*'&&t[i+1]==='/'))i++;i++;continue}
    out+=c;
  }
  return out.replace(/,(\s*[}\]])/g,'$1');
}
function parseLoose(txt){
  txt=String(txt||'').trim().replace(/^```[a-zA-Z]*\s*/,'').replace(/```\s*$/,'');
  try{return JSON.parse(txt)}catch(e){}
  var a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  if(a>=0&&b>a){
    var core=txt.slice(a,b+1);
    try{return JSON.parse(core)}catch(e){}
    return JSON.parse(repairJson(core));
  }
  throw new Error('geen JSON gevonden');
}
function hardErrors(o){
  try{
    if(o.plc==='none')return SF.checkLadder(o,SF.ladderOf(o)).errors;
    return SF.validate(o).filter(function(x){return /twee keer|basismodule|bestaat niet|geen uitgang/.test(x)});
  }catch(e){return ['Het programma kon dit project niet lezen: '+e.message]}
}
function applyProject(o,st,errs){
  var r=normalizeProject(o);undoP=P;P=r.project;changed(true);
  $('#aiUndo').hidden=false;
  st.className='aiStatus';st.textContent=(r.uitleg||'Klaar. Controleer de bladen hiernaast.')+(errs&&errs.length?'\n\nNog na te kijken: '+errs.join(' '):'');
}
function aiUI(){
  var b=$('#aiBody');
  b.innerHTML='<div class="f"><label for="aiText">Beschrijf je schakeling of wat er moet veranderen</label><textarea id="aiText"></textarea></div><div class="aiRow"><button class="btn primary" type="button" id="aiGo">Genereer</button><button class="btn" type="button" id="aiStop" hidden>Stoppen</button><button class="btn" type="button" id="aiUndo" hidden>Ongedaan maken</button></div><div class="aiStatus" id="aiStatus" role="status"></div><div id="aiManual" hidden></div>';
  $('#aiGo').onclick=aiRun;
  $('#aiStop').onclick=function(){if(aiCtl)aiCtl.abort()};
  $('#aiUndo').onclick=function(){if(!undoP)return;P=undoP;undoP=null;$('#aiUndo').hidden=true;$('#aiStatus').textContent='Vorige versie teruggezet.';changed(true)};
  $('#aiText').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();aiRun()}});
}
function renderTeach(){
  var b=$('#teachBody');if(!b)return;
  var R=TEACH.rules,E=TEACH.examples;
  b.innerHTML='<div class="rows" id="ruleList">'+(R.length?R.map(function(r,i){return '<div class="row" style="grid-template-columns:22px minmax(0,1fr) 28px"><span class="hint">'+(i+1)+'.</span><span style="font-size:13px">'+esc(r)+'</span><button class="x" type="button" data-rdel="'+i+'" aria-label="Regel verwijderen">×</button></div>'}).join(''):'<p class="hint">Nog geen regels.</p>')+'</div>'+
    '<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><input type="text" id="ruleNew" aria-label="Nieuwe regel"><button class="btn small" type="button" id="ruleAdd">Toevoegen</button></div>';
  function add(){var v=$('#ruleNew').value.trim();if(!v)return;TEACH.rules.push(v);saveTeach();var n=$('#ruleNew');if(n)n.focus()}
  $('#ruleAdd').onclick=add;
  $('#ruleNew').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add()}});
  b.querySelectorAll('[data-rdel]').forEach(function(x){x.onclick=function(){TEACH.rules.splice(+x.dataset.rdel,1);saveTeach()}});

}
function aiMode(){
  var h=$('#aiHint');if(!h)return;
  h.textContent=SAMPLE?'Gebruikt je eigen Claude-account. De eerste keer vraagt claude.ai om toestemming.'
    :'Geen directe verbinding met Claude hier (dat lukt alleen in de gepubliceerde versie op claude.ai). Genereer maakt dan een opdracht die je in een Claude-gesprek plakt.';
}
function aiManual(prompt){
  var m=$('#aiManual'),st=$('#aiStatus');
  m.hidden=false;
  m.innerHTML='<div class="f"><label for="aiPrompt">1. Kopieer deze opdracht en plak ze in een gesprek met Claude</label><textarea id="aiPrompt" rows="4" readonly style="font-family:var(--f-mono);font-size:11px"></textarea></div><div class="aiRow"><button class="btn" type="button" id="aiCopy">Opdracht kopiëren</button></div><div class="f"><label for="aiAnswer">2. Plak hier het antwoord van Claude</label><textarea id="aiAnswer" rows="4" style="font-family:var(--f-mono);font-size:11px"></textarea></div><div class="aiRow"><button class="btn primary" type="button" id="aiLoad">Antwoord laden</button></div>';
  $('#aiPrompt').value=prompt;
  $('#aiCopy').onclick=function(){
    navigator.clipboard.writeText(prompt).then(function(){toast('Opdracht gekopieerd. Plak ze in Claude.')}).catch(function(){$('#aiPrompt').focus();$('#aiPrompt').select();toast('Geselecteerd. Druk op Ctrl+C om te kopiëren.')});
  };
  $('#aiLoad').onclick=function(){
    try{var ao=parseLoose($('#aiAnswer').value);var ce=hardErrors(normalizeProject(JSON.parse(JSON.stringify(ao))).project);applyProject(ao,st,ce);m.hidden=true;m.innerHTML=''}
    catch(e){st.className='aiStatus err';st.textContent='Dat antwoord kon niet geladen worden. Plak het volledige antwoord van Claude (het JSON-blok).'}
  };
  st.className='aiStatus';st.textContent='';
}
function aiRun(){
  var q=$('#aiText').value.trim(),st=$('#aiStatus');
  if(!q){st.className='aiStatus err';st.textContent='Typ eerst wat je wilt laten tekenen.';$('#aiText').focus();return}
  var prompt=SCHEMA_TXT+teachText()+'\n\nHUIDIG PROJECT:\n'+JSON.stringify(P,function(k,v){return k==='drawing'?undefined:v})+'\n\nVRAAG VAN DE GEBRUIKER:\n'+q;
  lastQ=q;
  if(!SAMPLE||aiBlocked){aiManual(prompt);return}
  aiCtl=new AbortController();
  $('#aiGo').disabled=true;$('#aiStop').hidden=false;st.className='aiStatus';st.textContent='Bezig met nadenken…';
  var sig=aiCtl.signal;
  function ask(pr,attempt){
    return SAMPLE(pr+'\n\nAntwoord met ALLEEN het JSON-object, zonder uitleg ervoor of erna en zonder commentaar in de JSON.',{signal:sig,cache:false,onText:function(){st.textContent=attempt===1?'Schema wordt opgesteld…':'Schema wordt verbeterd…'}}).then(function(res){
      var o,cand;
      try{o=parseLoose(res.text);cand=normalizeProject(JSON.parse(JSON.stringify(o))).project}
      catch(e){
        if(attempt<3){
          st.textContent='Het antwoord was niet leesbaar; Claude probeert het opnieuw…';
          return ask(pr+'\n\nJE VORIGE ANTWOORD WAS GEEN GELDIGE JSON'+(res.truncated?' (het was te lang en werd afgebroken; schrijf compacter)':'')+'. Geef nu alleen het volledige, geldige JSON-object.',attempt+1);
        }
        throw {code:'invalid_json',truncated:res.truncated};
      }
      var errs=hardErrors(cand);
      if(errs.length&&attempt<3&&pr.indexOf('HET PROGRAMMA VOND DEZE FOUTEN')<0){
        st.textContent='Het programma vond '+errs.length+' fout'+(errs.length>1?'en':'')+'; Claude verbetert het schema…';
        return ask(pr+'\n\nJE VORIGE ANTWOORD:\n'+JSON.stringify(o)+'\n\nHET PROGRAMMA VOND DEZE FOUTEN IN JE ANTWOORD:\n- '+errs.join('\n- ')+'\n\nCorrigeer ze en antwoord opnieuw met het volledige JSON-object.',attempt+1);
      }
      return {o:o,errs:errs};
    });
  }
  ask(prompt,1).then(function(res){
    applyProject(res.o,st,res.errs);
  }).catch(function(e){
    var c=e&&e.code;
    if(c==='cancelled'){st.className='aiStatus';st.textContent='Gestopt.';return}
    st.className='aiStatus err';st.textContent=AI_ERR[c]||'Er ging iets mis. Probeer het opnieuw.';
    if(c==='not_granted'||c==='sampling_disabled'){aiBlocked=true;st.textContent+=' Druk opnieuw op Genereer om het via een gesprek met Claude te doen.'}
  }).then(function(){
    $('#aiGo').disabled=false;
    $('#aiStop').hidden=true;aiCtl=null;
  });
}
aiUI();aiMode();renderTeach();
if(typeof window.claude!=='undefined'&&window.claude&&window.claude.use){
  window.claude.use('sample').then(function(s){SAMPLE=s;aiMode()}).catch(aiMode);
  window.claude.use('downloads').then(function(d){DL=d}).catch(function(){});
  window.claude.use('db').then(function(db){
    if(!db)return;
    var ref=db.doc('teach/ai');
    ref.onSnapshot(function(snap){
      if(snap.exists){var d=snap.data()||{};TEACH={rules:Array.isArray(d.rules)?d.rules.slice():[],examples:Array.isArray(d.examples)?d.examples.slice():[]};lsSet(RULES_KEY,TEACH.rules);lsSet(EX_KEY,TEACH.examples);if(!TDB)TDB=ref;renderTeach();}
      else if(!tSynced){TDB=ref;if(TEACH.rules.length||TEACH.examples.length)saveTeach();else renderTeach();}
      tSynced=true;
    },function(){TDB=null;renderTeach()});
  }).catch(function(){});
}

/* collapsible cards: click a card title to fold it; remembered in this browser */
var FOLD_KEY='lazyelectrical.folded';
function cardName(h){var c=h.cloneNode(true);c.querySelectorAll('button').forEach(function(b){b.remove()});return c.textContent.trim()}
function applyFolds(){
  var f=lsGet(FOLD_KEY,[]);
  document.querySelectorAll('.form .card > h2').forEach(function(h){
    var n=cardName(h),on=f.indexOf(n)>=0;
    h.parentNode.classList.toggle('fold',on);h.tabIndex=0;h.setAttribute('role','button');h.setAttribute('aria-expanded',String(!on));
  });
}
function toggleFold(h){
  var f=lsGet(FOLD_KEY,[]),n=cardName(h),i=f.indexOf(n);
  if(i>=0)f.splice(i,1);else f.push(n);
  lsSet(FOLD_KEY,f);applyFolds();
}
$('.form').addEventListener('click',function(e){var h=e.target.closest('.card > h2');if(h&&!e.target.closest('button'))toggleFold(h)});
$('.form').addEventListener('keydown',function(e){var h=e.target.closest&&e.target.closest('.card > h2');if(h&&e.target===h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleFold(h)}});
renderForm();renderSheets();applyFolds();
})();
