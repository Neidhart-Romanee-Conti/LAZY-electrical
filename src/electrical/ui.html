<title>LAZY Electrical</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* LAZY Electrical workspace: ribbon on top, project tree and properties left, sheets in the middle,
   symbols and AI assistant right, checks at the bottom. One deliberate light theme (drawings are black on white). */
:root{
  --ink:#1d2024; --muted:#5d6670; --line:#d5d9de; --soft:#eef0f3; --panel:#f7f8fa; --white:#fff;
  --chrome:#23272d; --chrome2:#2e333a; --chrome-ink:#e9ecef; --accent:#f2a900; --accent-ink:#1d2024;
  --sel:#e8590c; --hover:#1971c2; --err:#c92a2a; --warn:#b26b00; --ok:#2b8a3e;
  --f-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--soft);color:var(--ink);font-family:var(--f-ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hover);outline-offset:1px}
.app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;height:100%}

/* title bar + ribbon tabs */
.title{display:flex;align-items:center;gap:12px;background:var(--chrome);color:var(--chrome-ink);padding:6px max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-left,0px));min-height:34px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:16px;height:20px}
.title .proj{color:#adb5bd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.title .saved{margin-left:auto;font-size:12px;color:#adb5bd;white-space:nowrap}
.qat{display:flex;gap:2px}
.qat button{background:none;border:0;color:var(--chrome-ink);padding:4px;border-radius:4px;display:flex}
.qat button:hover{background:var(--chrome2)}
.qat svg{width:18px;height:18px}
.rtabs{display:flex;gap:2px;background:var(--chrome);padding:0 8px;overflow-x:auto;scrollbar-width:none}
.rtabs button{background:none;border:0;color:#ced4da;padding:7px 14px 8px;border-radius:5px 5px 0 0;white-space:nowrap}
.rtabs button:hover{color:#fff;background:var(--chrome2)}
.rtabs button[aria-selected=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.rtabs button.file{background:var(--accent);color:var(--accent-ink);font-weight:600;margin-right:6px}
.ribbon{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);min-height:92px;overflow-x:auto;padding:4px 6px 0}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 6px}
.rgroup .items{display:flex;align-items:flex-start;gap:2px;flex:1}
.rgroup .col{display:flex;flex-direction:column;gap:1px}
.rgroup .glabel{font-size:11px;color:var(--muted);text-align:center;padding:3px 0 4px;white-space:nowrap}
.rb{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:4px;padding:2px 6px;white-space:nowrap;color:var(--ink)}
.rb:hover{background:#e7f0fb;border-color:#b9d3f0}
.rb[aria-pressed=true]{background:#fff2cc;border-color:var(--accent)}
.rb:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.rb svg{width:16px;height:16px;flex:none}
.rb.big{flex-direction:column;gap:3px;padding:4px 8px;min-width:56px;font-size:12px}
.rb.big svg{width:28px;height:28px}
.rgroup select,.rgroup input{border:1px solid var(--line);border-radius:3px;background:#fff;padding:2px 4px;max-width:120px}

/* main work area */
.work{display:grid;grid-template-columns:var(--lw,260px) minmax(0,1fr) var(--rw,290px);min-height:0}
.work.noleft{grid-template-columns:0 minmax(0,1fr) var(--rw,290px)} .work.noright{grid-template-columns:var(--lw,260px) minmax(0,1fr) 0}
.work.noleft.noright{grid-template-columns:0 minmax(0,1fr) 0}
.dock{display:flex;flex-direction:column;min-height:0;background:var(--panel);overflow:hidden}
.dock.left{border-right:1px solid var(--line)} .dock.right{border-left:1px solid var(--line)}
.dtabs{display:flex;border-bottom:1px solid var(--line);background:#eceef1;flex:none}
.dtabs button{flex:1;background:none;border:0;padding:7px 4px;color:var(--muted);border-bottom:2px solid transparent}
.dtabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);background:var(--panel)}
.dbody{flex:1;overflow:auto;min-height:0}
.dbody[hidden]{display:none}

/* workspace tree */
.tree{list-style:none;margin:0;padding:4px 0}
.tree ul{list-style:none;margin:0;padding-left:14px}
.tree .node{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:3px;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tree .node:hover{background:#e7f0fb}
.tree .node.on{background:#fff2cc}
.tree .tw{width:12px;color:var(--muted);flex:none;text-align:center}
.tree .ic{width:16px;height:16px;flex:none;color:var(--muted)}
.tree .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:22px}
.tree .cnt{margin-left:auto;font-size:11px;color:var(--muted)}

/* properties */
.props{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.props h3{margin:2px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.props .f{display:flex;flex-direction:column;gap:2px}
.props label{font-size:12px;color:var(--muted)}
.props input,.props select,.props textarea{border:1px solid var(--line);border-radius:3px;background:#fff;padding:4px 6px;width:100%}
.props .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.props .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
.props .chk input{width:auto}
.props .info{font-size:12px;color:var(--muted);line-height:1.45}
.props .info b{color:var(--ink);font-weight:600}
.props .btns{display:flex;flex-wrap:wrap;gap:4px}
.btn{border:1px solid #c3c9d0;background:#fff;border-radius:4px;padding:4px 10px}
.btn:hover{border-color:var(--hover);color:var(--hover)}
.btn.primary{background:var(--chrome);color:#fff;border-color:var(--chrome)}
.btn.primary:hover{background:#000;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.cores{width:100%;border-collapse:collapse;font-size:12px}
.cores td{padding:1px}
.cores input{padding:2px 4px}

/* symbols */
.symfilter{padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.symfilter input{width:100%;border:1px solid var(--line);border-radius:3px;padding:5px 7px;background:#fff}
.symcat{padding:6px 8px 2px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:3px;padding:2px 6px 6px}
.sym{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;border-radius:4px;background:none;padding:4px 2px;font-size:10.5px;line-height:1.15;color:var(--ink);text-align:center;min-height:72px}
.sym:hover{background:#fff;border-color:var(--line)}
.sym[aria-pressed=true]{background:#fff2cc;border-color:var(--accent)}
.sym svg{color:var(--ink)}
.sym .star{align-self:flex-end;margin:-2px -1px -12px 0;font-size:11px;color:#adb5bd;line-height:1}
.sym .star.on{color:var(--accent)}

/* center: document tabs + views */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.doctabs{display:flex;gap:2px;background:#e3e6ea;padding:4px 4px 0;overflow-x:auto;flex:none;scrollbar-width:thin}
.doctab{display:flex;align-items:center;gap:6px;background:#d3d8de;border:0;border-radius:5px 5px 0 0;padding:5px 6px 5px 10px;white-space:nowrap;color:var(--muted);max-width:240px}
.doctab span{overflow:hidden;text-overflow:ellipsis}
.doctab[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600}
.doctab .x{border:0;background:none;color:inherit;border-radius:3px;padding:0 4px;line-height:1.2}
.doctab .x:hover{background:#c92a2a;color:#fff}
.view{flex:1;position:relative;min-height:0;background:#8c949c;overflow:hidden}
.view.tableview{background:#fff;overflow:auto}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
#cv .hit *{fill:transparent;stroke:transparent;stroke-width:1.6;pointer-events:all}
#cv.t-select .hit g{cursor:move}
#cv.t-draw{cursor:crosshair}
#cv .page g[data-id]:hover *{stroke:var(--hover)} #cv .page g[data-id]:hover text{fill:var(--hover)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f1f3f5;font-size:15px;text-align:center;padding:24px}
.dbt{border-collapse:collapse;font-size:12.5px;min-width:100%}
.dbt th{position:sticky;top:0;background:#eceef1;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
.dbt td{padding:4px 8px;border-bottom:1px solid #eef0f2;vertical-align:top}
.dbt tr.go:hover td{background:#e7f0fb;cursor:pointer}
.dbt tr.grp td{background:#f3f4f6;font-weight:600}
.dbt td input{border:1px solid transparent;background:transparent;padding:2px 4px;width:100%;min-width:90px}
.dbt td input:hover,.dbt td input:focus{border-color:var(--line);background:#fff}
.tablebar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;left:0}
.tablebar h2{margin:0;font-size:15px}
.tablebar .sp{flex:1}

/* bottom: checks + status bar */
.checks{border-top:1px solid var(--line);background:var(--panel);max-height:30vh;overflow:auto;font-size:12.5px}
.checks[hidden]{display:none}
.checks .hd{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.checks .hd b{font-size:12px}
.checks .hd .sp{flex:1}
.chk-row{display:flex;gap:8px;padding:4px 10px;border-bottom:1px solid #eef0f2;cursor:pointer}
.chk-row:hover{background:#e7f0fb}
.lv{font-weight:700;width:16px;text-align:center}
.lv.error{color:var(--err)} .lv.warn{color:var(--warn)} .lv.info{color:var(--muted)}
.status{display:flex;align-items:center;gap:16px;background:var(--chrome);color:#ced4da;font-size:12px;padding:3px max(12px,env(safe-area-inset-left,0px)) calc(3px + env(safe-area-inset-bottom,0px));white-space:nowrap;overflow:hidden}
.status button{background:none;border:0;color:inherit;padding:0}
.status .err{color:#ff8787} .status .wrn{color:#ffc078} .status .ok{color:#8ce99a}
.status .sp{flex:1}

/* AI panel */
.ai{padding:10px;display:flex;flex-direction:column;gap:8px}
.ai textarea{border:1px solid var(--line);border-radius:4px;background:#fff;padding:7px;min-height:110px;resize:vertical;width:100%}
.ai .row{display:flex;gap:6px;flex-wrap:wrap}
.ai .hint{font-size:12px;color:var(--muted);line-height:1.45}
.aistatus{font-size:12.5px;white-space:pre-wrap;line-height:1.45;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px;max-height:40vh;overflow:auto}
.aistatus.err{border-color:#ffa8a8;background:#fff5f5}
.aistatus:empty{display:none}
.rules{display:flex;flex-direction:column;gap:3px}
.rules .rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:start;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:3px 6px}
.rules .rl button{border:0;background:none;color:var(--muted)}
.ai details summary{cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}

/* backstage (File) */
.back{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:220px minmax(0,1fr);background:#fff}
.back[hidden]{display:none}
.back nav{background:var(--chrome);color:var(--chrome-ink);display:flex;flex-direction:column;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));gap:2px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.back nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 20px;display:flex;align-items:center;gap:10px}
.back nav button:hover{background:var(--chrome2)}
.back nav button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.back nav svg{width:18px;height:18px}
.back nav .close{margin-bottom:10px;font-weight:600}
.back section{overflow:auto;padding:28px max(24px,env(safe-area-inset-right,0px)) 28px 32px}
.back h1{margin:0 0 16px;font-size:24px;font-weight:600}
.back h2{font-size:15px;margin:22px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;max-width:960px}
.card{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--hover);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.card b{font-size:14px} .card span{color:var(--muted);font-size:12.5px;line-height:1.4}
.form{display:grid;grid-template-columns:minmax(140px,200px) minmax(0,420px);gap:8px 12px;align-items:center;max-width:680px}
.form label{color:var(--muted)}
.form input,.form select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;width:100%}
.note{color:var(--muted);max-width:680px;line-height:1.5}

/* dialogs, menus, toast */
.modal{position:fixed;inset:0;background:rgba(20,24,28,.35);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal .box{background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(440px,100%);max-height:90vh;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0;font-size:16px}
.modal .f{display:flex;flex-direction:column;gap:3px}
.modal label{font-size:12px;color:var(--muted)}
.modal input,.modal select,.modal textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;background:#fff}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.modal .msg{color:var(--ink);line-height:1.5;white-space:pre-wrap}
.ctx{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:4px;min-width:180px}
.ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:4px}
.ctx button:hover{background:#e7f0fb}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.toast{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--chrome);color:#fff;padding:9px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:min(560px,90vw)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:860px){
  .work{grid-template-columns:0 minmax(0,1fr) 0}
  .work.showleft{grid-template-columns:min(260px,70vw) minmax(0,1fr) 0}
  .work.showright{grid-template-columns:0 minmax(0,1fr) min(290px,75vw)}
  .back{grid-template-columns:minmax(0,1fr)} .back nav{flex-direction:row;overflow-x:auto;padding:calc(6px + env(safe-area-inset-top,0px)) 6px 6px} .back nav button{padding:8px 12px;white-space:nowrap}
  .form{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="app" id="app">
  <div class="title">
    <div class="brand"><svg viewBox="0 0 16 20" aria-hidden="true"><path d="M2 1h7L6 8h6L4 19l2-8H2z" fill="#f2a900"/></svg>LAZY Electrical</div>
    <div class="qat" id="qat"></div>
    <div class="proj" id="projName"></div>
    <div class="saved" id="saved"></div>
  </div>
  <div class="rtabs" id="rtabs" role="tablist" aria-label="Lint"></div>
  <div class="ribbon" id="ribbon"></div>
  <div class="work" id="work">
    <aside class="dock left" aria-label="Werkruimte">
      <div class="dtabs" role="tablist"><button type="button" data-ltab="tree" aria-selected="true">Werkruimte</button><button type="button" data-ltab="props" aria-selected="false">Eigenschappen</button></div>
      <div class="dbody" id="treeBody"></div>
      <div class="dbody" id="propsBody" hidden></div>
    </aside>
    <section class="center">
      <div class="doctabs" id="doctabs" role="tablist" aria-label="Open bladen"></div>
      <div class="view" id="view"></div>
      <div class="checks" id="checks" hidden></div>
    </section>
    <aside class="dock right" aria-label="Symbolen en AI">
      <div class="dtabs" role="tablist"><button type="button" data-rtab="syms" aria-selected="true">Symbolen</button><button type="button" data-rtab="ai" aria-selected="false">AI-assistent</button></div>
      <div class="dbody" id="symBody"></div>
      <div class="dbody" id="aiBody" hidden></div>
    </aside>
  </div>
  <div class="status" id="status"></div>
</div>
<div class="back" id="back" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
